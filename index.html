<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<style>
body {
display:flex; justify-content:center; align-items:center; height:100vh;
background:#000; color:#fff; font-family:sans-serif; margin:0; text-align:center;
}
#loading { font-size:28px;}
#btn {
font-size:24px; padding:20px 40px; cursor:pointer; background:#222;
color:#fff; border:2px solid #555; display:none;
}
img { max-width:90vw; max-height:90vh; display:none;}
</style>
</head>
<body>
<div id="loading">Loading... Please wait</div>
<button id="btn" onclick="showScare()">Click to Continue</button>
<img id="scareImg" src="https://i.imgur.com/ocxf6Gt.jpeg" alt="Jeff the Killer">
<audio id="growl" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_e0b5a3c8d2.mp3"></audio>
<script>
setTimeout(() => {
document.getElementById('loading').style.display = 'none';
document.getElementById('btn').style.display = 'inline-block';
}, 3000);

function showScare() {
document.getElementById('btn').style.display = 'none';
document.getElementById('scareImg').style.display = 'block';
document.getElementById('growl').volume = 0.25;
document.getElementById('growl').play();
}
</script>
</body>
</html>
